version: "3.9"

services:
  worker_service:
    image: ghcr.io/${GHCR_OWNER}/worker_service:latest
    container_name: worker_service
    build:
      context: .
      dockerfile: worker_service/Dockerfile
    ports:
      - "9000:9000"
    environment:
      - LLM_MODE=${LLM_MODE:-online}
      - HF_API_KEY=${HF_API_KEY:-}
      - LOGGING_WS_URL=ws://logging_service:8099/ws/logs
      - QDRANT_HOST=qdrant_service
      - QDRANT_PORT=6333
      - SQLITE_PATH=/sqlite/hellencommerce.db
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
    volumes:
      - ./app:/app/app
      - ./app/prompts:/app/prompts
      - ./data/sqlite_store:/sqlite
      # VolÃºmenes de modelos locales (solo necesarios si LLM_MODE=local)
      # - /mnt/data/HellenData/minilm:/models/minilm
    networks:
      - hellen_network
    restart: unless-stopped

networks:
  hellen_network:
    external: true
