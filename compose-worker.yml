version: "3.9"

services:
  worker_service:
    # 🚀 CORREGIDO: Ruta de imagen fija alineada con las etiquetas unificadas de tu GitHub
    image: ghcr.io/miguelnarbona/hellencommerce-worker_service:latest
    container_name: bunker-worker_service
    build:
      context: .
      dockerfile: worker_service/Dockerfile
    ports:
      - "9000:9000"
    environment:
      - LLM_MODE=${LLM_MODE:-online}
      - HF_API_KEY=${HF_API_KEY:-}
      - LOGGING_WS_URL=ws://logging_service:8099/ws/logs
      - QDRANT_HOST=qdrant_service
      - QDRANT_PORT=6333
      - SQLITE_PATH=/sqlite/hellencommerce.db
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
    volumes:
      # 🚀 CORREGIDO: Volumen de Stanza alineado con la ruta interna /app de tu ecosistema Python
      - /home/mnf/HellenData/StanfordNLP/stanza:/app/StanfordNLP/stanza
      - /home/mnf/HellenData/osrm:/maps
      - /home/mnf/HellenData/chroma_store:/chroma_store
      - /home/mnf/HellenData/qdrant_store:/qdrant_store
      - /home/mnf/HellenData/sqlite_store:/sqlite
    networks:
      - hellen_network
    restart: unless-stopped

networks:
  hellen_network:
    external: true
