version: "3.9"

services:
  fastapi_service:
    image: ghcr.io/${GHCR_OWNER}/hellencommerce-fastapi_service:latest
    container_name: bunker_fastapi_service
    build:
      context: .
      dockerfile: fastapi_service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - LLM_MODE=${LLM_MODE:-online}
      - HF_API_KEY=${HF_API_KEY:-}
      - APP_SERVICE_URL=http://worker_service:9000
      - INTENT_SERVICE_URL=http://intent_service:9010
      - MISTRAL_SERVICE_URL=http://mistral_service:9001
      - LOGGING_WS_URL=ws://logging_service:8099/ws/logs
      - SQLITE_PATH=/sqlite/hellencommerce.db
      - QDRANT_HOST=qdrant_service
      - QDRANT_PORT=6333
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
    volumes:
      - ./app:/app/app
      - ./app/prompts:/app/prompts
      # - ./data/sqlite_store:/sqlite
      # - /home/mnf/HellenData/StanfordNLP:/models/stanza
      # - /home/mnf/HellenData/osrm:/maps
      # - /home/mnf/HellenData/chroma_store:/chroma_store
      # - /home/mnf/HellenData/qdrant_store:/qdrant_store
      # - /home/mnf/HellenData/sqlite_store:/sqlite
    networks:
      - hellen_network
    restart: unless-stopped

networks:
  hellen_network:
    external: true
