version: "3.9"

services:
  mistral_service:
    image: ghcr.io/${GHCR_OWNER}/hellencommerce-mistral_services:latest
    container_name: bunker-mistral_service
    build:
      context: .
      dockerfile: mistral_service/Dockerfile
    ports:
      - "9001:9001"
    environment:
      - LLM_MODE=${LLM_MODE:-online}
      - HF_API_KEY=${HF_API_KEY:-}
      - LOGGING_WS_URL=ws://logging_service:8099/ws/logs
      # Path del modelo GGUF local (solo relevante si LLM_MODE=local)
      - MODEL_PATH=/models/Qwen/Qwen2.5-3B-Instruct-GGUF/qwen2.5-3b-instruct-q4_k_m.gguf
    volumes:
      - ./app:/app/app
      # Volumen de modelos locales (opcional, solo en modo local)
      # - /mnt/data/HellenData/Qwen:/models/Qwen
      - ./data/logs:/app/logs
      # - ./data/sqlite_store:/sqlite
      # - /home/mnf/HellenData/StanfordNLP:/models/stanza
      # - /home/mnf/HellenData/osrm:/maps
      # - /home/mnf/HellenData/chroma_store:/chroma_store
      # - /home/mnf/HellenData/qdrant_store:/qdrant_store
      # - /home/mnf/HellenData/sqlite_store:/sqlite
    networks:
      - hellen_network
    restart: unless-stopped

networks:
  hellen_network:
    external: true
