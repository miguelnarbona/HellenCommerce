version: "3.9"

services:
  intent_service:
    build:
      context: .
      dockerfile: intent_service/Dockerfile
    image: hellen-intent
    container_name: intent_service
    ports:
      - "9010:9010"
    environment:
      # 👇 Credenciales para el modelo Qwen en línea
      - HF_API_KEY=${HF_API_KEY}
      # 👇 Credenciales para los modelos oficiales de Mistral AI
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - MISTRAL_URL=${MISTRAL_URL}
      - MISTRAL_URL_MODEL=${MISTRAL_URL_MODEL}
      - MISTRAL_MODEL_NAME=${MISTRAL_MODEL_NAME}
      - MISTRAL_ORGANIZATION=${MISTRAL_ORGANIZATION}
      - MISTRAL_ORGANIZATION_ID=${MISTRAL_ORGANIZATION_ID}
    volumes:
      - ./app:/app/app
    networks:
      - hellen_network

networks:
  hellen_network:
    external: true
