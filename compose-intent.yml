version: "3.9"

services:
  intent_service:
    image: ghcr.io/${GHCR_OWNER}/intent_service:latest
    container_name: intent_service
    build:
      context: .
      dockerfile: intent_service/Dockerfile
    ports:
      - "9010:9010"
    environment:
      - LLM_MODE=${LLM_MODE:-online}
      - HF_API_KEY=${HF_API_KEY:-}
      - LOGGING_WS_URL=ws://logging_service:8099/ws/logs
    volumes:
      - ./app:/app/app
    networks:
      - hellen_network
    restart: unless-stopped

networks:
  hellen_network:
    external: true
