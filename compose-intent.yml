version: "3.9"

services:
  bunker_intent_service:
    image: ghcr.io/miguelnarbona/hellencommerce-intent_service:latest
    container_name: bunker_intent_service
    build:
      context: .
      dockerfile: intent_service/Dockerfile
    ports:
      - "9010:9010"
    environment:
      - LLM_MODE=${LLM_MODE:-online}
      - HF_API_KEY=${HF_API_KEY:-}
      - LOGGING_WS_URL=ws://logging_service:8099/ws/logs
    volumes:
      # 🚀 CORREGIDO: Eliminamos el volumen de custom_dict para que use el original de la imagen
      # 🚀 CORREGIDO: Mapeo de Stanza alineado con la ruta interna /app de tu script Python
      - /home/mnf/HellenData/StanfordNLP/stanza:/app/StanfordNLP/stanza
      - /home/mnf/HellenData/osrm:/maps
      - /home/mnf/HellenData/chroma_store:/chroma_store
      - /home/mnf/HellenData/qdrant_store:/qdrant_store
      - /home/mnf/HellenData/sqlite_store:/sqlite
    networks:
      - hellen_network
    restart: unless-stopped

networks:
  hellen_network:
    external: true
