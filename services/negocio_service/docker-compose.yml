version: '3.8'

services:
  negocio_service:
    # 🚀 USAMOS LA IMAGEN MÁSTER UNIFICADA
    image: ghcr.io/miguelnarbona/hellencommerce-services:latest
    container_name: bunker_negocio_service
    ports:
      - "8021:8021"
    environment:
      # 🚀 VARIABLES OBLIGATORIAS PARA EL ENTRYPOINT
      - SERVICE_NAME=negocio_service
      - SERVICE_PORT=8021
      - LLM_MODE=${LLM_MODE:-online}
      - HF_API_KEY=${HF_API_KEY:-}
      - LOGGING_WS_URL=ws://logging_service:8099/ws/logs
    volumes:
      # 🚀 CORREGIDO: Mapeamos la carpeta global a la ruta que Python necesita
      - ../app:/app/app
      # Mapeo local para mantener el código sincronizado en Debian
      - .:/app/services/negocio_service

networks:
  default:
    name: hellen_network
    external: true
