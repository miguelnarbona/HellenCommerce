version: '3.8'

services:
  contacto_service:
    # 🚀 USAMOS LA IMAGEN MÁSTER UNIFICADA
    image: ghcr.io/miguelnarbona/hellencommerce-services:latest
    container_name: bunker_contacto_service
    ports:
      - "8011:8011"
    environment:
      # 🚀 INYECTAMOS LAS VARIABLES PARA TU ENTRYPOINT
      - SERVICE_NAME=contacto_service
      - SERVICE_PORT=8011
      - LLM_MODE=${LLM_MODE:-online}
      - HF_API_KEY=${HF_API_KEY:-}
      - LOGGING_WS_URL=ws://logging_service:8099/ws/logs
    volumes:
      # 🚀 CORREGIDO: Mapeamos la carpeta compartida global a la ruta exacta que busca Python
      - ../app:/app/app
      # Si necesitas editar el código del servicio de contacto en vivo, se mapea a su subcarpeta interna:
      - .:/app/services/contacto_service

networks:
  default:
    name: hellen_network
    external: true
