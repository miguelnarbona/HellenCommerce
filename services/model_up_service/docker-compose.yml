version: '3.8'

services:
  model_up_service:
    build:
      context: ..
      dockerfile: model_up_service/Dockerfile
    ports:
      - "8014:8014"
    environment:
      - LOGGING_WS_URL=ws://logging_service:8099/ws/logs
    volumes:
      - ../app:/app/shared
      - .:/app/model_up_service
    depends_on:
      - logging_service

networks:
  default:
    name: hellen_network
    external: true
