version: '3.8'

services:
  saludo_service:
    build:
      context: ..
      dockerfile: saludo_service/Dockerfile
    ports:
      - "8018:8018"
    environment:
      - LOGGING_WS_URL=ws://logging_service:8099/ws/logs
    volumes:
      - ../app:/app/shared
      - .:/app/saludo_service
    depends_on:
      - logging_service

networks:
  default:
    name: hellen_network
    external: true
