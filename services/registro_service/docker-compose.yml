version: '3.8'

services:
  registro_service:
    build:
      context: ..
      dockerfile: registro_service/Dockerfile
    ports:
      - "8010:8010"
    environment:
      - LOGGING_WS_URL=ws://logging_service:8099/ws/logs
    volumes:
      - ../app:/app/shared
      - .:/app/registro_service
    depends_on:
      - logging_service

networks:
  default:
    name: hellen_network
    external: true
