services:
  # ============================================================
  # SERVICIOS PRINCIPALES INDEPENDIENTES
  # ============================================================

  # ------ MICROSERVICIO 1 ------
  - type: web
    name: fastapi_service
    env: docker
    plan: free
    dockerCommand: python -m uvicorn main:app --host 0.0.0.0 --port 8080 --workers 2

  # ------ MICROSERVICIO 2 ------
  - type: web
    name: intent_service
    env: docker
    plan: free
    dockerCommand: python -u -m uvicorn main:app --host 0.0.0.0 --port 9010 --workers 1

  # ------ MICROSERVICIO 3 ------
  - type: web
    name: logging_service
    env: docker
    plan: free
    dockerCommand: python -m uvicorn main:app --host 0.0.0.0 --port 8099 --workers 1

  # ------ MICROSERVICIO 4 ------
  - type: web
    name: map_service
    env: docker
    plan: free
    dockerCommand: python -u -m uvicorn main:app --host 0.0.0.0 --port 5000 --workers 1

  # ------ MICROSERVICIO 5 ------
  - type: web
    name: mistral_service
    env: docker
    plan: free
    dockerCommand: python -u -m uvicorn main:app --host 0.0.0.0 --port 9001 --workers 1

  # ------ MICROSERVICIO 6 ------
  - type: web
    name: worker_service
    env: docker
    plan: free
    dockerCommand: python -m uvicorn main:app --host 0.0.0.0 --port 9000 --workers 1


