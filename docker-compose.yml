version: '3.9'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ============================================================
  # FASTAPI INGRESS - Punto de entrada único
  # ============================================================
  fastapi_service:
    build:
      context: .
      dockerfile: fastapi_service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - LLM_MODE=${LLM_MODE:-online}
      - HF_API_KEY=${HF_API_KEY:-}
      - SQLITE_PATH=/sqlite/hellencommerce.db
      - INTENT_SERVICE_URL=http://intent_service:9010
      - WORKER_SERVICE_URL=http://worker_service:9000
      - MISTRAL_SERVICE_URL=http://mistral_service:9001
      - LOGGING_WS_URL=ws://logging_service:8099/ws/logs
      - QDRANT_HOST=qdrant_service
      - QDRANT_PORT=6333
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
    volumes:
      - ./app:/app/app
      - ./app/prompts:/app/prompts
      - ./data/sqlite_store:/sqlite
    depends_on:
      intent_service:
        condition: service_healthy
      worker_service:
        condition: service_healthy
      mistral_service:
        condition: service_healthy
      logging_service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hellen_network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================================
  # INTENT SERVICE - Detección de intenciones
  # ============================================================
  intent_service:
    build:
      context: .
      dockerfile: intent_service/Dockerfile
    ports:
      - "9010:9010"
    environment:
      - LLM_MODE=${LLM_MODE:-online}
      - HF_API_KEY=${HF_API_KEY:-}
      - LOGGING_WS_URL=ws://logging_service:8099/ws/logs
    volumes:
      - ./app:/app/app
    depends_on:
      logging_service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hellen_network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9010/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================================
  # WORKER SERVICE - Generador de prompts y embeddings (Qdrant)
  # ============================================================
  worker_service:
    build:
      context: .
      dockerfile: worker_service/Dockerfile
    ports:
      - "9000:9000"
    environment:
      - LLM_MODE=${LLM_MODE:-online}
      - HF_API_KEY=${HF_API_KEY:-}
      - SQLITE_PATH=/sqlite/hellencommerce.db
      - QDRANT_HOST=qdrant_service
      - QDRANT_PORT=6333
      - LOGGING_WS_URL=ws://logging_service:8099/ws/logs
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
    volumes:
      - ./app:/app/app
      - ./app/prompts:/app/prompts
      - ./data/sqlite_store:/sqlite
    depends_on:
      logging_service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hellen_network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 4g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ============================================================
  # MISTRAL SERVICE - Unificador de respuestas
  # ============================================================
  mistral_service:
    build:
      context: .
      dockerfile: mistral_service/Dockerfile
    ports:
      - "9001:9001"
    environment:
      - LLM_MODE=${LLM_MODE:-online}
      - HF_API_KEY=${HF_API_KEY:-}
      - LOGGING_WS_URL=ws://logging_service:8099/ws/logs
    volumes:
      - ./app:/app/app
    depends_on:
      logging_service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hellen_network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================================
  # LOGGING SERVICE - Subsistema de Logs y Self-Healing
  # ============================================================
  logging_service:
    build:
      context: .
      dockerfile: logging_service/Dockerfile
    ports:
      - "8099:8099"
    environment:
      - LLM_MODE=${LLM_MODE:-online}
      - HF_API_KEY=${HF_API_KEY:-}
      - LOGS_DB_PATH=/app/logs/hellen_logs.db
      - EXTERNAL_LLM_URL=${EXTERNAL_LLM_URL:-https://api.anthropic.com/v1/messages}
      - EXTERNAL_LLM_KEY=${EXTERNAL_LLM_KEY:-}
      - EXTERNAL_LLM_MODEL=${EXTERNAL_LLM_MODEL:-claude-3-5-sonnet-20241022}
      - ADMIN_NOTIFY_WEBHOOK=${ADMIN_NOTIFY_WEBHOOK:-}
    volumes:
      - ./app:/app/app
      - ./data/logs:/app/logs
    restart: unless-stopped
    networks:
      - hellen_network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================================
  # ADMIN DASHBOARD - Panel de administración
  # ============================================================
  admin_dashboard:
    build:
      context: ./admin_dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - LOGGING_API_URL=http://logging_service:8099
    depends_on:
      logging_service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hellen_network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================================
