version: '3.8'

services:
  # ============================================================
  # FASTAPI INGRESS - Punto de entrada único
  # ============================================================
  fastapi_service:
    build:
      context: .
      dockerfile: fastapi_service/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SQLITE_PATH=/app/data/app.db
      - PROMPTS_PATH=/app/prompts
      - RESOURCES_PATH=/app/resources
      - INTENT_SERVICE_URL=http://intent_service:8002
      - WORKER_SERVICE_URL=http://worker_service:8003
      - MISTRAL_SERVICE_URL=http://mistral_service:8004
      - LOGGING_WS_URL=ws://logging_service:8099/ws/logs
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-}
      - CLAUDE_WEBHOOK_URL=${CLAUDE_WEBHOOK_URL:-}
    volumes:
      - ./app/data:/app/data
      - ./app/prompts:/app/prompts
      - ./app/resources:/app/resources
    depends_on:
      - intent_service
      - worker_service
      - mistral_service
      - logging_service
    restart: unless-stopped
    networks:
      - hellen_network

  # ============================================================
  # INTENT SERVICE - Detección de intenciones
  # ============================================================
  intent_service:
    build:
      context: .
      dockerfile: intent_service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - INTENT_MODEL_PATH=/app/models/intent_model.gguf
      - LOGGING_WS_URL=ws://logging_service:8099/ws/logs
    volumes:
      - ./app/models:/app/models:ro
      - ./app/resources:/app/resources:ro
    depends_on:
      - logging_service
    restart: unless-stopped
    networks:
      - hellen_network

  # ============================================================
  # WORKER SERVICE - Generador de prompts
  # ============================================================
  worker_service:
    build:
      context: .
      dockerfile: worker_service/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - SQLITE_PATH=/app/data/app.db
      - PROMPTS_PATH=/app/prompts
      - LOGGING_WS_URL=ws://logging_service:8099/ws/logs
    volumes:
      - ./app/data:/app/data
      - ./app/prompts:/app/prompts:ro
    depends_on:
      - logging_service
    restart: unless-stopped
    networks:
      - hellen_network

  # ============================================================
  # MISTRAL SERVICE - Unificador de respuestas
  # ============================================================
  mistral_service:
    build:
      context: .
      dockerfile: mistral_service/Dockerfile
    ports:
      - "8004:8004"
    environment:
      - MISTRAL_MODEL_PATH=/app/models/mistral.gguf
      - LOGGING_WS_URL=ws://logging_service:8099/ws/logs
    volumes:
      - ./app/models:/app/models:ro
    depends_on:
      - logging_service
    restart: unless-stopped
    networks:
      - hellen_network

  # ============================================================
  # LOGGING SERVICE - Subsistema de Logs y Self-Healing
  # ============================================================
  logging_service:
    build:
      context: .
      dockerfile: logging_service/Dockerfile
    ports:
      - "8099:8099"
    environment:
      - LOGS_DB_PATH=/app/logs/hellen_logs.db
      - EXTERNAL_LLM_URL=${EXTERNAL_LLM_URL:-https://api.anthropic.com/v1/messages}
      - EXTERNAL_LLM_KEY=${EXTERNAL_LLM_KEY:-}
      - EXTERNAL_LLM_MODEL=${EXTERNAL_LLM_MODEL:-claude-3-5-sonnet-20241022}
      - ADMIN_NOTIFY_WEBHOOK=${ADMIN_NOTIFY_WEBHOOK:-}
    volumes:
      - ./app/logs:/app/logs
    restart: unless-stopped
    networks:
      - hellen_network

  # ============================================================
  # ADMIN DASHBOARD - Panel de administración
  # ============================================================
  admin_dashboard:
    build:
      context: ./admin_dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - LOGGING_API_URL=http://logging_service:8099
    depends_on:
      - logging_service
    restart: unless-stopped
    networks:
      - hellen_network

  # ============================================================
  # SERVICIOS ESPECIALIZADOS POR CATEGORÍA
  # ============================================================
  
  registro_service:
    build:
      context: .
      dockerfile: services/registro_service/Dockerfile
    ports:
      - "8010:8010"
    environment:
      - REGISTRO_MODEL_PATH=/app/models/registro_model.gguf
      - SQLITE_PATH=/app/data/app.db
      - LOGGING_WS_URL=ws://logging_service:8099/ws/logs
    volumes:
