name: "Cazador Oracle Free Tier"
on:
  workflow_dispatch: # Permite activarlo manualmente desde la pestaña Actions
  repository_dispatch:
    types: [retrigger-oracle-loop] # Permite que el pipeline se llame a sí mismo

jobs:
  buscar-instancia:
    runs-on: ubuntu-latest
    steps:
      # 1. Configurar la herramienta CLI de Oracle (OCI) nativamente
      - name: Instalar y Configurar Oracle Cloud CLI
        run: |
          pip install oci-cli --upgrade --quiet
          mkdir -p ~/.oci
          cat << 'EOF' > ~/.oci/oci_api_key.pem
          ${{ secrets.OCI_KEY_CONTENT }}
          EOF
          chmod 600 ~/.oci/oci_api_key.pem
          cat << EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          EOF
          chmod 600 ~/.oci/config

      # 2. Ejecutar el Script de Bucle de Adquisición
      - name: Ejecutar script de peticiones concurrentes
        id: oci-loop
        env:
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          TENANCY_ID="${{ secrets.OCI_TENANCY_OCID }}"
          echo "=== FASE 1: DESPLIEGUE DE RED (NETWORKING) ==="
          
          # Intentar buscar la VCN específica por nombre
          VCN_ID=$(oci network vcn list --compartment-id "$TENANCY_ID" --display-name "vcn-hellencommerce" --query "data[0].id" --raw-output 2>/dev/null)
          
          if [ -z "$VCN_ID" ] || [ "$VCN_ID" == "null" ]; then
            echo "No se encontró 'vcn-hellencommerce'. Buscando CUALQUIER VCN disponible..."
            VCN_ID=$(oci network vcn list --compartment-id "$TENANCY_ID" --query "data[0].id" --raw-output 2>/dev/null)
          fi

          if [ -z "$VCN_ID" ] || [ "$VCN_ID" == "null" ]; then
            echo "No se encontró ninguna VCN existente. El límite de red podría estar lleno."
            echo "Buscando VCNs antiguas para eliminarlas automáticamente y liberar espacio..."
            
            # Obtener lista de todas las VCNs en la cuenta
            ALL_VCNS=$(oci network vcn list --compartment-id "$TENANCY_ID" --query "data[*].id" --raw-output 2>/dev/null || echo "")
            
            if [ -n "$ALL_VCNS" ] && [ "$ALL_VCNS" != "null" ]; then
              for OLD_VCN in $ALL_VCNS; do
                echo "Eliminando dependencias de la VCN antigua: [$OLD_VCN]..."
                
                # 1. Buscar y eliminar Subredes asociadas
                SUBNETS=$(oci network subnet list --compartment-id "$TENANCY_ID" --vcn-id "$OLD_VCN" --query "data[*].id" --raw-output 2>/dev/null || echo "")
                for SUB in $SUBNETS; do
                  if [ -n "$SUB" ] && [ "$SUB" != "null" ]; then
                    echo "Borrando subred: [$SUB]"
                    oci network subnet delete --subnet-id "$SUB" --force 2>/dev/null || true
                  fi
                done
                
                # 2. Buscar y desvincular/eliminar Internet Gateways asociados
                IGS=$(oci network internet-gateway list --compartment-id "$TENANCY_ID" --vcn-id "$OLD_VCN" --query "data[*].id" --raw-output 2>/dev/null || echo "")
                for IG in $IGS; do
                  if [ -n "$IG" ] && [ "$IG" != "null" ]; then
                    echo "Borrando Internet Gateway: [$IG]"
                    oci network internet-gateway delete --ig-id "$IG" --force 2>/dev/null || true
                  fi
                done
                
                # 3. Eliminar la VCN limpia para liberar el slot de límite
                echo "Borrando estructura principal de la VCN..."
                oci network vcn delete --vcn-id "$OLD_VCN" --force 2>/dev/null || true
                sleep 5
              done
            fi

            echo "Espacio liberado. Creando la nueva red corporativa..."
            VCN_ID=$(oci network vcn create --compartment-id "$TENANCY_ID" --display-name "vcn-hellencommerce" --cidr-block "10.0.0.0/16" --query "data.id" --raw-output)
            IG_ID=$(oci network internet-gateway create --compartment-id "$TENANCY_ID" --display-name "ig-hellencommerce" --is-enabled true --vcn-id "$VCN_ID" --query "data.id" --raw-output)
            RT_ID=$(oci network vcn get --vcn-id "$VCN_ID" --query "data.\"default-route-table-id\"" --raw-output)
            oci network route-table update --rt-id "$RT_ID" --route-rules "[{\"cidrBlock\":\"0.0.0.0/0\",\"networkEntityId\":\"$IG_ID\"}]" > /dev/null
            SUBNET_ID=$(oci network subnet create --compartment-id "$TENANCY_ID" --vcn-id "$VCN_ID" --display-name "subnet-hellencommerce" --cidr-block "10.0.0.0/24" --route-table-id "$RT_ID" --prohibit-public-ip-on-vnic false --query "data.id" --raw-output)
          else
            echo "Utilizando VCN existente con ID: [$VCN_ID]"
            SUBNET_ID=$(oci network subnet list --compartment-id "$TENANCY_ID" --vcn-id "$VCN_ID" --query "data[0].id" --raw-output 2>/dev/null)
            if [ -z "$SUBNET_ID" ] || [ "$SUBNET_ID" == "null" ]; then
              echo "Creando subred pública..."
              RT_ID=$(oci network vcn get --vcn-id "$VCN_ID" --query "data.\"default-route-table-id\"" --raw-output)
              SUBNET_ID=$(oci network subnet create --compartment-id "$TENANCY_ID" --vcn-id "$VCN_ID" --display-name "subnet-hellencommerce" --cidr-block "10.0.8.0/24" --route-table-id "$RT_ID" --prohibit-public-ip-on-vnic false --query "data.id" --raw-output)
            else
              echo "Subred detectada con ID: [$SUBNET_ID]"
            fi
          fi

          echo "=== FASE 2: PREPARACIÓN DE SCRIPTS Y LLAVES ==="
          echo "${{ secrets.OCI_SSH_PUBLIC_KEY }}" > oracle_hellen.pub
          cat << 'EOF' > cloud_init_ubuntu.sh
          #!/bin/bash
          sleep 15
          export DEBIAN_FRONTEND=noninteractive
          apt-get update && apt-get dist-upgrade -y && apt-get install -y curl
          curl -sSL https://githubusercontent.com | bash
          EOF

          echo "=== FASE 3: BÚSQUEDA DINÁMICA DE UBUNTU 24.04 ARM ==="
          IMAGE_ID=$(oci compute image list \
            --compartment-id "$TENANCY_ID" \
            --shape "VM.Standard.A1.Flex" \
            --operating-system "Canonical Ubuntu" \
            --sort-by "TIMECREATED" \
            --query "data[?contains(\"operating-system-version\", '24.04')].id |" \
            --raw-output 2>/dev/null)

          if [ -z "$IMAGE_ID" ] || [ "$IMAGE_ID" == "null" ]; then
            IMAGE_ID=$(oci compute image list --compartment-id "$TENANCY_ID" --shape "VM.Standard.A1.Flex" --operating-system "Canonical Ubuntu" --sort-by "TIMECREATED" --query "data[*].{id:id, name:display-name}" 2>/dev/null | jq -r '.[] | select(.name | contains("24.04")) | .id' | head -n 1)
          fi
          echo "ID de Imagen Ubuntu 24.04 ARM detectado para tu región: [$IMAGE_ID]"

          echo "=== FASE 4: BUCLE DE ADQUISICIÓN LIMITADO ==="
          START_TIME=$(date +%s)
          AD_NAME=$(oci iam availability-domain list --compartment-id "$TENANCY_ID" --query "data[0].name" --raw-output 2>/dev/null)

          if [ -z "$AD_NAME" ] || [ -z "$SUBNET_ID" ] || [ "$SUBNET_ID" == "null" ] || [ -z "$IMAGE_ID" ] || [ "$IMAGE_ID" == "null" ]; then
            echo "❌ Error Crítico: Parámetros base vacíos (AD, Subnet o Imagen 24.04 inválidos)."
            exit 1
          fi

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            if [ $ELAPSED -gt 21300 ]; then
              echo "⏱ Límite de tiempo alcanzado (5h 55m). Activando autorelevo..."
              echo "exito=timeout" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Consultando disponibilidad en ($AD_NAME)..."
            set +e
            RESPONSE=$(oci compute instance launch \
              --availability-domain "$AD_NAME" \
              --compartment-id "$TENANCY_ID" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":2,"memoryInGBs":12}' \
              --boot-volume-size-in-gbs 100 \
              --is-pv-encryption-in-transit-enabled true \
              --instance-options '{"areLegacyImdsEndpointsDisabled":true}' \
              --user-data-file "cloud_init_ubuntu.sh" \
              --display-name "servidor-bunker-hellencommerce" \
              --image-id "$IMAGE_ID" \
              --subnet-id "$SUBNET_ID" \
              --vnic-display-name "vnic-hellencommerce" \
              --assign-public-ip true \
              --ssh-authorized-keys-file "oracle_hellen.pub" 2>&1)
            ESTADO_COMANDO=$?
            set -e

            if [ $ESTADO_COMANDO -eq 0 ] && [ -n "$RESPONSE" ]; then
              echo "🎉 ¡VICTORIA! Instancia aprovisionada con éxito."
              echo "exito=true" >> "$GITHUB_OUTPUT"
              rm -f cloud_init_ubuntu.sh oracle_hellen.pub
              exit 0
            fi

            echo "Aviso de la API de Oracle o Capacidad Máxima alcanzada:"
            echo "$RESPONSE" | grep -E "Out of capacity|TooManyRequests|InternalServerError" || echo "Detalle: $RESPONSE"
            echo "Esperando 60 segundos para el siguiente intento..."
            sleep 60
          done

      # 3. Paso de Autorelevo
      - name: Relanzar bucle si hubo Timeout
        if: steps.oci-loop.outputs.exito == 'timeout'
        run: |
          echo "Relanzando el flujo debido a restricciones de tiempo en GitHub..."
          curl -H "Authorization: token ${{ secrets.GH_PAT_RETRIGGER }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -X POST \
            -d '{"event_type": "retrigger-oracle-loop"}' \
            "https://github.com/${{ github.repository }}/dispatches"
