name: Build and Push to GHCR (Matrix)

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # -------------------------------------------------------
          # SERVICIOS PRIMARIOS (contexto raíz: necesitan app/ compartido)
          # -------------------------------------------------------
          - name: fastapi_service
            context: .
            file: ./fastapi_service/Dockerfile

          - name: intent_service
            context: .
            file: ./intent_service/Dockerfile

          - name: logging_service
            context: .
            file: ./logging_service/Dockerfile

          - name: mistral_service
            context: .
            file: ./mistral_service/Dockerfile

          - name: worker_service
            context: .
            file: ./worker_service/Dockerfile

          # -------------------------------------------------------
          # SERVICIO DE MAPA (contexto propio: no necesita app/ compartido)
          # -------------------------------------------------------
          - name: map_service
            context: ./map_service
            file: ./map_service/Dockerfile

          # -------------------------------------------------------
          # SERVICIOS SECUNDARIOS (1 Sola Imagen Unificada)
          # -------------------------------------------------------
          - name: secondary_services
            context: .
            file: ./services/Dockerfile

    steps:
      # PASO 1: Liberar espacio en disco del runner de GitHub
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false  # false para no romper buildx

      - name: Checkout repository
        uses: actions/checkout@v4

      # PASO 2: QEMU para compilación ARM64 desde runners AMD64 de GitHub
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # PASO 3: Docker Buildx para builds multi-arquitectura
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Downcase repository owner
        id: repo_owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PASO 4: Build multi-arch y push a GHCR
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false   # Evita el bug visual de OS/Arch en GHCR
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------
  # JOB 2: Notificar y desplegar en Oracle Cloud vía webhook
  # ----------------------------------------------------------------
  auto-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Notificar y desplegar en Oracle Cloud
        continue-on-error: true
        run: |
          curl -fsS -X POST http://${{ secrets.ORACLE_SERVER_IP }}:10001/hooks/deploy-hellen-commerce \
            --max-time 30 || echo "⚠️ Webhook de deploy no disponible, continuando..."
