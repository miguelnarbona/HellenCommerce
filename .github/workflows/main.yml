name: Build and Push to GHCR (Matrix- No-Oracle)

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  # PASO PREVIO: Detectar qué carpetas cambiaron en este commit
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      fastapi_service: ${{ steps.filter.outputs.fastapi_service }}
      intent_service: ${{ steps.filter.outputs.intent_service }}
      logging_service: ${{ steps.filter.outputs.logging_service }}
      mistral_service: ${{ steps.filter.outputs.mistral_service }}
      worker_service: ${{ steps.filter.outputs.worker_service }}
      map_service: ${{ steps.filter.outputs.map_service }}
      services: ${{ steps.filter.outputs.services }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            fastapi_service: 'fastapi_service/**'
            intent_service: 'intent_service/**'
            logging_service: 'logging_service/**'
            mistral_service: 'mistral_service/**'
            worker_service: 'worker_service/**'
            map_service: 'map_service/**'
            services: 'services/**'

  # JOB DE COMPILACIÓN
  build-and-push:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    # Declaramos las variables aquí para que el validador de GitHub las reconozca desde el inicio
    env:
      IMAGE_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hellencommerce-fastapi_service
            context: .
            file: ./fastapi_service/Dockerfile
            key: fastapi_service

          - name: hellencommerce-intent_service
            context: .
            file: ./intent_service/Dockerfile
            key: intent_service

          - name: hellencommerce-logging_service
            context: .
            file: ./logging_service/Dockerfile
            key: logging_service

          - name: hellencommerce-mistral_service
            context: .
            file: ./mistral_service/Dockerfile
            key: mistral_service

          - name: hellencommerce-worker_service
            context: .
            file: ./worker_service/Dockerfile
            key: worker_service

          - name: hellencommerce-map_service
            context: .
            file: ./map_service/Dockerfile
            key: map_service

          - name: hellencommerce-services
            context: .
            file: ./services/Dockerfile
            key: services
            
    steps:
      # PASO 1: Liberación agresiva de espacio en disco
      - name: Free Disk Space (Aggressive Cleanup)
        if: needs.changes.outputs[matrix.key] == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      # PASO 2: Forzar el nombre del dueño y repositorio a minúsculas reescribiendo el entorno de forma segura
      - name: Downcase repository owner and name
        if: needs.changes.outputs[matrix.key] == 'true'
        run: |
          echo "IMAGE_OWNER=$(echo "${{ env.IMAGE_OWNER }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPO_NAME=$(echo "${{ env.REPO_NAME }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # PASO 3: Descargar el repositorio
      - name: Checkout repository
        if: needs.changes.outputs[matrix.key] == 'true'
        uses: actions/checkout@v4

      # PASO 4: QEMU para compilación ARM64
      - name: Set up QEMU
        if: needs.changes.outputs[matrix.key] == 'true'
        uses: docker/setup-qemu-action@v3

      # PASO 5: Configurar Docker Buildx
      - name: Set up Docker Buildx
        if: needs.changes.outputs[matrix.key] == 'true'
        uses: docker/setup-buildx-action@v3

      # PASO 6: Autenticación segura usando el token nativo de GitHub
      - name: Log in to GHCR
        if: needs.changes.outputs[matrix.key] == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PASO 7: Build multi-arquitectura y push a GHCR
      - name: Build and push ${{ matrix.name }}
        if: needs.changes.outputs[matrix.key] == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.REPO_NAME }}-${{ matrix.name }}:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.REPO_NAME }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
