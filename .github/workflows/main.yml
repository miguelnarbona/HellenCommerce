name: Build and Push to GHCR (Matrix)

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fastapi_service
            context: .
            file: ./fastapi_service/Dockerfile

          - name: intent_service
            context: .
            file: ./intent_service/Dockerfile

          - name: logging_service
            context: .
            file: ./logging_service/Dockerfile

          - name: mistral_service
            context: .
            file: ./mistral_service/Dockerfile

          - name: worker_service
            context: .
            file: ./worker_service/Dockerfile

          - name: map_service
            context: ./map_service
            file: ./map_service/Dockerfile

          - name: secondary_services
            context: .
            file: ./services/Dockerfile

    steps:
      # PASO 1: Liberación agresiva de espacio en disco (Asegura >30GB libres)
      - name: Free Disk Space (Aggressive Cleanup)
        run: |
          echo "=== Espacio antes de la limpieza ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "=== Espacio después de la limpieza ==="
          df -h

      # PASO 2: Forzar el nombre del dueño a minúsculas
      - name: Downcase repository owner
        run: |
          echo "IMAGE_OWNER=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: '${{ github.repository_owner }}'

      # PASO 3: Descargar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # PASO 4: QEMU para compilación ARM64
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # PASO 5: Docker Buildx sin almacenamiento en caché local excesivo
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PASO 6: Build multi-arch y push a GHCR
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ matrix.name }}:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ matrix.name }}:${{ github.sha }}
          # Usamos caché directo de GitHub Actions (gha) para no llenar el disco duro local
          cache-from: type=gha
          cache-to: type=gha,mode=max

  auto-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Notificar y desplegar en Oracle Cloud
        run: |
          curl -fsS -X POST http://${{ secrets.ORACLE_SERVER_IP }}:10001/hooks/deploy-hellen-commerce \
            --max-time 30 || echo "⚠️ Webhook de deploy no disponible, continuando..."
