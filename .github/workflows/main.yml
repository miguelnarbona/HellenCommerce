name: Build and Push to GHCR (Matrix)

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest 
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # --- SERVICIOS EN LA RAÍZ ---
          - name: fastapi_service
            context: ./fastapi_service
          - name: intent_service
            context: ./intent_service
          - name: logging_service
            context: ./logging_service
          - name: map_service
            context: ./map_service
          - name: mistral_service
            context: ./mistral_service
            
          # 💡 SOLUCIÓN DEFINITIVA PARA WORKER: 
          # Toma la raíz como contexto y lee directamente el Dockerfile interno sin trucos raros
          - name: worker_service
            context: .
            file: ./worker_service/Dockerfile

          # --- SERVICIOS EN LA CARPETA /SERVICES ---
          - name: compra_service
            context: ./services/compra_service
          - name: contacto_service
            context: ./services/contacto_service
          - name: despedida_service
            context: ./services/despedida_service
          - name: informativa_service
            context: ./services/informativa_service
          - name: mensajeria_service
            context: ./services/mensajeria_service
          - name: model_up_service
            context: ./services/model_up_service
          - name: negocio_service
            context: ./services/negocio_service
          - name: notificacion_service
            context: ./services/notificacion_service
          - name: otra_service
            context: ./services/otra_service
          - name: registro_service
            context: ./services/registro_service
          - name: saludo_service
            context: ./services/saludo_service
          - name: servicio_service
            context: ./services/servicio_service
          - name: transporte_service
            context: ./services/transporte_service
          - name: venta_service
            context: ./services/venta_service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Downcase repository owner
        id: repo_owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push service
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          # 💡 Si la matriz define un 'file' específico lo usa; si no, busca el por defecto en el contexto
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
