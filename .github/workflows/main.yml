name: Build and Push to GHCR (Matrix)

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- SERVICIOS EN LA RAÍZ ---
          - name: fastapi_service
            context: ./fastapi_service
          - name: intent_service
            context: ./intent_service
          - name: logging_service
            context: ./logging_service
          - name: map_service
            context: ./map_service
          - name: mistral_service
            context: ./mistral_service
          
          # 💡 SOLUCIÓN DEFINITIVA PARA WORKER
          - name: worker_service
            context: .
            file: ./worker_service/Dockerfile

          # --- SERVICIOS EN LA CARPETA /SERVICES ---
          - name: compra_service
            context: ./services/compra_service
          - name: contacto_service
            context: ./services/contacto_service
          - name: despedida_service
            context: ./services/despedida_service
          - name: informativa_service
            context: ./services/informativa_service
          - name: mensajeria_service
            context: ./services/mensajeria_service
          - name: negocio_service
            context: ./services/negocio_service
          - name: notificacion_service
            context: ./services/notificacion_service
          - name: otra_service
            context: ./services/otra_service
          - name: registro_service
            context: ./services/registro_service
          - name: saludo_service
            context: ./services/saludo_service
          - name: servicio_service
            context: ./services/servicio_service
          - name: transporte_service
            context: ./services/transporte_service
          - name: venta_service
            context: ./services/venta_service

    steps:
      # PASO 1: Maximizar el espacio en disco eliminando software innecesario de GitHub
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false # Deja esto en false para no romper buildx

      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar emulador QEMU (Esencial para compilar ARM64 desde servidores AMD de GitHub)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. Configurar Docker Buildx para habilitar compilación avanzada
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Downcase repository owner
        id: repo_owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Compilar usando Matrix para múltiples arquitecturas simultáneamente
      - name: Build and push service
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          # Habilita la compatibilidad híbrida para tu entorno local (amd64) y tu Oracle Ampere (arm64)
          platforms: linux/amd64,linux/arm64
          # Corrige de manera definitiva el bug visual de la columna "OS/Arch" en GitHub
          provenance: false
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  auto-deploy:
    needs: build-and-push # Espera obligatoriamente a que terminen de compilar con éxito las imágenes
    runs-on: ubuntu-latest
    steps:
      - name: Notificar y desplegar en Oracle Cloud
        continue-on-error: true
        run: |
          curl -X POST http://${{ secrets.ORACLE_SERVER_IP }}:10001/hooks/deploy-hellen-commerce
