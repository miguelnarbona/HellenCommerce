name: Build and Push to GHCR (Matrix- No-Oracle)

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Permiso necesario para publicar en GHCR
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fastapi_service
            context: ./fastapi_service
            file: ./fastapi_service/Dockerfile

          - name: intent_service
            context: ./intent_service
            file: ./intent_service/Dockerfile

          - name: logging_service
            context: ./logging_service
            file: ./logging_service/Dockerfile

          - name: mistral_service
            context: ./mistral_service
            file: ./mistral_service/Dockerfile

          - name: worker_service
            context: ./worker_service
            file: ./worker_service/Dockerfile

          - name: map_service
            context: ./map_service
            file: ./map_service/Dockerfile

          - name: services
            context: ./services
            file: ./services/Dockerfile

    steps:
      # PASO 1: Liberación agresiva de espacio en disco (Evita problemas de almacenamiento)
      - name: Free Disk Space (Aggressive Cleanup)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      # PASO 2: Forzar el nombre del dueño y repositorio a minúsculas
      - name: Downcase repository owner and name
        run: |
          echo "IMAGE_OWNER=${OWNER,,}" >> $GITHUB_ENV
          echo "REPO_NAME=${REPO,,}" >> $GITHUB_ENV
        env:
          OWNER: '${{ github.repository_owner }}'
          REPO: '${{ github.event.repository.name }}'

      # PASO 3: Descargar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # PASO 4: QEMU para compilación ARM64
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # PASO 5: Configurar Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PASO 6: Autenticación segura usando el token nativo de GitHub
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PASO 7: Build multi-arquitectura y push a GHCR
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.REPO_NAME }}-${{ matrix.name }}:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.REPO_NAME }}-${{ matrix.name }}:${{ github.sha }}
          # Almacenamiento en caché en la nube de GitHub para acelerar compilaciones futuras
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
